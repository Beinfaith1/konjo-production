<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    :root { color-scheme: light dark; }
    .mark-dark { display: none; }
    .mark-light { display: block; }
    @media (prefers-color-scheme: light) {
      .mark-dark { display: block; }
      .mark-light { display: none; }
    }
  </style>
  <image class="mark-light" href="data:image/png;base64," width="64" height="64" />
  <image class="mark-dark" href="data:image/png;base64," width="64" height="64" />
</svg>